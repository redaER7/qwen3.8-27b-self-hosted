apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: beta-rate-limit
  namespace: envoy-ai-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai-gateway
  connection:
    bufferLimit: 32Mi
  rateLimit:
    type: Local
    local:
      rules:
        - clientSelectors:
            - headers:
                - name: x-ai-eg-model
                  type: Exact
                  value: "Qwen/Qwen3.8-27B"
          limit:
            # 100 req/min while box is bench-only (bench sweeps peak ~300+ req/min);
            # lower to 30 for production
            requests: 1000
            unit: Minute