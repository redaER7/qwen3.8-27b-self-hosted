apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextchat-route
  namespace: frontend
spec:
  parentRefs:
    - name: ai-gateway
      namespace: envoy-ai-gateway-system
      sectionName: chat-https
  hostnames:
    - chat.yacodata.com
  rules:
    - backendRefs:
        - name: nextchat
          port: 3000
